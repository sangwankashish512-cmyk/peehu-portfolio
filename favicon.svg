<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Neural Nodes -->
  <circle cx="32" cy="18" r="4" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="18" cy="34" r="4" fill="#06b6d4"/>
  <circle cx="46" cy="34" r="4" fill="#8b5cf6"/>
  <circle cx="25" cy="48" r="3.5" fill="#6366f1"/>
  <circle cx="39" cy="48" r="3.5" fill="#a855f7"/>
  <!-- Connections -->
  <line x1="32" y1="18" x2="18" y2="34" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="18" x2="46" y2="34" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18" y1="34" x2="25" y2="48" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="46" y1="34" x2="39" y2="48" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18" y1="34" x2="46" y2="34" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.5"/>
  <line x1="25" y1="48" x2="39" y2="48" stroke="url(#glowGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
